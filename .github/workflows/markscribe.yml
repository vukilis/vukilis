name: markscribe

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  markscribe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate README
        uses: muesli/readme-scribe@master
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          template: 'README.gtpl'
          writeTo: 'README.md'

      - name: Fetch RSS via rss2json and update README
        run: |
          python3 -c "
          import urllib.request
          import urllib.parse
          import json
          import re

          # 1. Fetch the posts
          rss_url = 'https://vukilis.com/rss.xml'
          api_url = f'https://api.rss2json.com/v1/api.json?rss_url={urllib.parse.quote(rss_url, safe=\"\")}'
          
          try:
              req = urllib.request.Request(api_url)
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
              
              if data.get('status') == 'ok':
                  items = data.get('items', [])[:5]
                  md_list = []
                  for item in items:
                      title = item.get('title', '')
                      link = item.get('link', '')
                      
                      # Get description, strip HTML tags, and truncate
                      desc = item.get('description', '')
                      desc = re.sub(r'<[^>]+>', '', desc) # Removes HTML tags
                      if len(desc) > 120:
                          desc = desc[:117] + '...'       # Truncate to 120 chars
                      
                      # Format: Title - Description
                      md_list.append(f\"- [{title}]({link}) - {desc}\")
                      
                  new_posts = '\n'.join(md_list)
              else:
                  new_posts = 'Error: Could not fetch RSS feed.'
          except Exception as e:
              new_posts = 'Error: Failed to connect to rss2json.'

          # 2. Inject into README.md using the Heading
          heading = '### 📰 Recent Blog Posts'
          
          with open('README.md', 'r') as f:
              lines = f.readlines()
              
          start_index = -1
          end_index = len(lines)
          
          for i, line in enumerate(lines):
              if line.strip() == heading:
                  start_index = i
                  break
                  
          if start_index != -1:
              for i in range(start_index + 1, len(lines)):
                  if lines[i].startswith('###') or lines[i].startswith('##'):
                      end_index = i
                      break
                      
              new_readme = ''.join(lines[:start_index+1])
              new_readme += '\n' + new_posts + '\n'
              new_readme += ''.join(lines[end_index:])
              
              with open('README.md', 'w') as f:
                  f.write(new_readme)
              print('Successfully injected posts into README.md')
          else:
              print('ERROR: Blog Posts heading not found in README.md!')
          "

      - name: Commit README
        uses: stefanzweifel/git-auto-commit-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          commit_message: 'markscribe: update README.md'
