name: markscribe

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  markscribe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate README
        uses: muesli/readme-scribe@master
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          template: 'README.gtpl'
          writeTo: 'README.md'

      - name: Fetch RSS via rss2json and update README
        run: |
          python3 -c "
          import urllib.request
          import urllib.parse
          import json
          import re

          # The API requires the URL to be strictly encoded
          rss_url = 'https://vukilis.com/rss.xml'
          api_url = f'https://api.rss2json.com/v1/api.json?rss_url={urllib.parse.quote(rss_url, safe=\"\")}'
          
          print(f'Fetching from: {api_url}')
          
          try:
              req = urllib.request.Request(api_url)
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
              
              print(f'API Status: {data.get(\"status\")}')
              
              if data.get('status') == 'ok':
                  items = data.get('items', [])[:5]
                  md_list = []
                  for item in items:
                      md_list.append(f\"- [{item['title']}]({item['link']})\")
                  new_posts = '\n'.join(md_list)
                  print(f'Generated Posts:\n{new_posts}')
              else:
                  new_posts = 'Error: rss2json could not fetch the feed.'
                  print('API returned an error status.')
          except Exception as e:
              print(f'Error fetching API: {e}')
              new_posts = 'Error: Failed to connect to rss2json.'

          # Read the README.md
          with open('README.md', 'r') as f:
              readme = f.read()

          # Safely replace the placeholders
          def replace_placeholders(match):
              return f'{match.group(1)}\n{new_posts}\n{match.group(3)}'

          pattern = r'(<!-- BLOG_POSTS_START -->)(.*?)(<!-- BLOG_POSTS_END -->)'
          updated_readme = re.sub(pattern, replace_placeholders, readme, flags=re.DOTALL)

          # Save the updated README.md
          with open('README.md', 'w') as f:
              f.write(updated_readme)
          "

      - name: Commit README
        uses: stefanzweifel/git-auto-commit-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          commit_message: 'markscribe: update README.md'
